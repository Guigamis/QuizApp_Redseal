<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Red Seal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="quiz-container">
      <div class="quiz-card">
        <section id="cec-setup-screen" class="setup-screen">
          <p class="eyebrow">Quiz Red Seal</p>
          <h1>Select Options</h1>
          <div id="section-options" class="section-options" aria-label="CEC 2024 sections"></div>
          <div class="setup-choice-layout">
            <div class="question-count-options" aria-label="Number of questions">
              <button class="count-btn" type="button" data-question-count="15">15 questions</button>
              <button class="count-btn" type="button" data-question-count="30">30 questions</button>
              <button class="count-btn" type="button" data-question-count="50">50 questions</button>
              <button class="count-btn" type="button" data-question-count="all">All questions</button>
            </div>
          </div>

          <div class="notes-area">
            <button id="notes-toggle-btn" class="notes-toggle-btn" type="button" aria-expanded="false" aria-controls="notes-panel">
              Anotações
            </button>
            <div id="notes-panel" class="notes-panel" hidden>
              <label for="note-input">Escreva uma anotação</label>
              <textarea id="note-input" rows="3" placeholder="Ex.: revisar instalações elétricas"></textarea>
              <button id="save-note-btn" class="primary-btn" type="button">Salvar anotação</button>
              <div id="notes-list" class="notes-list" aria-live="polite"></div>
            </div>
          </div>
        </section>

        <section id="quiz-screen" class="hidden" hidden>
          <p id="progress" class="progress">Question 1 of 15</p>
          <h1 id="question">Loading question...</h1>

          <div id="answers" class="answers" aria-live="polite"></div>

          <div class="quiz-actions">
            <button id="previous-btn" class="secondary-btn" type="button">Previous</button>
            <button id="reset-btn" class="secondary-btn" type="button">Reset</button>
            <div class="navigation-buttons">
              <button id="next-btn" class="primary-btn" type="button">Próxima questão</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="script.js?v=4"></script>
  </body>
</html>
